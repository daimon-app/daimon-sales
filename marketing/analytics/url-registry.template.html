<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAIMON MORNING Edition｜UTM実URL台帳</title>
<style>body{margin:0;padding:28px;background:#101010;color:#f5f1e8;font-family:system-ui,"Noto Sans JP",sans-serif;line-height:1.6}main{max-width:1180px;margin:auto}h1{margin-bottom:4px}p,small{color:#c7c0b4}.notice{padding:14px;border-left:3px solid #dbb561;background:#1a1814}.config{display:grid;gap:12px;margin:24px 0;padding:20px;border:1px solid #403a2e;background:#171717}.config label{display:grid;gap:4px;font-weight:700}.config input{padding:10px;border:1px solid #64583e;background:#0e0e0e;color:#fff;border-radius:6px}button{min-height:44px;padding:8px 14px;border:0;border-radius:999px;background:#dbb561;color:#19140a;font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:10px;border-bottom:1px solid #39342b;vertical-align:top;text-align:left}th{position:sticky;top:0;background:#222;color:#f6dfac}code{word-break:break-all;color:#d9d1c0}.muted{color:#aaa096}@media(max-width:760px){body{padding:14px}table{font-size:.75rem}th,td{padding:7px}}</style>
</head>
<body><main>
<h1>DAIMON MORNING Edition｜UTM実URL台帳</h1>
<p>公開前はURLを生成しても外部公開・投稿をしません。未取得handleは`未取得`として残し、取得済みと表示しません。</p>
<div class="notice"><strong>入力はこの設定欄だけです。</strong> `LP base URL`には承認済みHTTPS URLを、handleには取得確認済みの値だけを入れます。空欄のままのURLは有効URLとして使えません。</div>
<section class="config">
<label>LP base URL（必須）<input id="baseUrl" type="url" placeholder="https://example.jp/daimon/" autocomplete="off"></label>
<label>TikTok handle（未取得なら空欄）<input id="tiktokHandle" placeholder="未取得"></label>
<label>Instagram handle（未取得なら空欄）<input id="instagramHandle" placeholder="未取得"></label>
<label>YouTube handle / channel ID（未取得なら空欄）<input id="youtubeHandle" placeholder="未取得"></label>
<label>X handle（未取得なら空欄）<input id="xHandle" placeholder="未取得"></label>
<label>Threads handle（未取得なら空欄）<input id="threadsHandle" placeholder="未取得"></label>
<div><button id="build" type="button">台帳を生成</button> <button id="download" type="button">CSVをダウンロード</button></div>
</section>
<p id="status" class="muted">LP base URLを入力して「台帳を生成」を選択してください。</p>
<table><thead><tr><th>platform</th><th>role</th><th>account status</th><th>handle</th><th>campaign</th><th>content</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
(() => {
  const PLATFORMS = [
    {source:'tiktok',role:'primary',key:'tiktokHandle'},
    {source:'instagram',role:'primary',key:'instagramHandle'},
    {source:'youtube',role:'primary',key:'youtubeHandle'},
    {source:'x',role:'supporting',key:'xHandle'},
    {source:'threads',role:'supporting',key:'threadsHandle'}
  ];
  const CONTENTS = [
    ['prelaunch','profile'], ['prelaunch','pinned'],
    ...Array.from({length:10},(_,i)=>['prelaunch',`p${String(i+1).padStart(2,'0')}`]),
    ...Array.from({length:10},(_,i)=>['launch',`p${String(i+11).padStart(2,'0')}`]),
    ...Array.from({length:10},(_,i)=>['evergreen',`p${String(i+21).padStart(2,'0')}`]),
    ['prelaunch','cm-a'], ['launch','cm-b'], ['launch','cm-c']
  ];
  let registry=[];
  const el=id=>document.getElementById(id);
  const csvEscape=value=>`"${String(value).replaceAll('"','""')}"`;
  function normalizedBase() { return el('baseUrl').value.trim().replace(/\/+$/, ''); }
  function makeUrl(base, source, campaign, content) {
    const url = new URL(base + '/');
    url.searchParams.set('utm_source', source);
    url.searchParams.set('utm_medium', 'organic_social');
    url.searchParams.set('utm_campaign', campaign);
    url.searchParams.set('utm_content', content);
    return url.toString();
  }
  function render() {
    const base=normalizedBase();
    const valid=/^https:\/\//.test(base);
    registry=[];
    if(!valid){el('status').textContent='有効なHTTPSのLP base URLが必要です。外部公開は行われません。';el('rows').replaceChildren();return;}
    const handles=Object.fromEntries(PLATFORMS.map(p=>[p.key,el(p.key).value.trim()]));
    PLATFORMS.forEach(platform=>CONTENTS.forEach(([campaign,content])=>{
      const handle=handles[platform.key] || '未取得';
      registry.push({platform:platform.source,role:platform.role,account_status:handle==='未取得'?'unclaimed':'owner-confirmed',handle,campaign,utm_medium:'organic_social',utm_content:content,url:makeUrl(base,platform.source,campaign,content)});
    }));
    const fragment=document.createDocumentFragment();
    registry.forEach(row=>{const tr=document.createElement('tr');[row.platform,row.role,row.account_status,row.handle,row.campaign,row.utm_content,row.url].forEach((value,index)=>{const td=document.createElement('td');if(index===6){const code=document.createElement('code');code.textContent=value;td.append(code);}else td.textContent=value;tr.append(td)});fragment.append(tr)});
    el('rows').replaceChildren(fragment);
    el('status').textContent=`${registry.length}件を生成しました。handleが「未取得」の行は投稿・公開に使わないでください。`;
  }
  el('build').addEventListener('click',render);
  el('download').addEventListener('click',()=>{
    if(!registry.length){render();if(!registry.length)return;}
    const header=['platform','role','account_status','handle','utm_medium','utm_campaign','utm_content','url'];
    const lines=[header.join(','),...registry.map(row=>header.map(key=>csvEscape(row[key])).join(','))];
    const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daimon-morning-url-registry.csv';a.click();URL.revokeObjectURL(a.href);
  });
})();
</script>
</body></html>
