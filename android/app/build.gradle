plugins {
    id 'com.android.application'
}

def billingProductId = providers.gradleProperty('DAIMON_BILLING_PRODUCT_ID')
        .orElse(providers.environmentVariable('DAIMON_BILLING_PRODUCT_ID'))
        .getOrElse('daimon_monthly')
def billingBasePlanId = providers.gradleProperty('DAIMON_BILLING_BASE_PLAN_ID')
        .orElse(providers.environmentVariable('DAIMON_BILLING_BASE_PLAN_ID'))
        .getOrElse('monthly-2500-jpy')
def billingIdsVerified = providers.gradleProperty('DAIMON_BILLING_IDS_VERIFIED')
        .orElse(providers.environmentVariable('DAIMON_BILLING_IDS_VERIFIED'))
        .map { it.equalsIgnoreCase('true') }.getOrElse(false)
def billingVerificationUrl = providers.gradleProperty('DAIMON_BILLING_VERIFICATION_URL')
        .orElse(providers.environmentVariable('DAIMON_BILLING_VERIFICATION_URL'))
        .getOrElse('')
def billingServerVerified = providers.gradleProperty('DAIMON_BILLING_SERVER_VERIFIED')
        .orElse(providers.environmentVariable('DAIMON_BILLING_SERVER_VERIFIED'))
        .map { it.equalsIgnoreCase('true') }.getOrElse(false)

if (!(billingProductId ==~ /[a-z0-9_.]+/) || !(billingBasePlanId ==~ /[a-z0-9-]+/)) {
    throw new GradleException('Invalid DAIMON Billing product/base-plan identifier.')
}
if (billingServerVerified && !(billingVerificationUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?(?:\/.*)?/)) {
    throw new GradleException('Verified Billing server requires an HTTPS verification URL.')
}

def signingValues = [
        storeFile: providers.environmentVariable('DAIMON_UPLOAD_STORE_FILE').orNull,
        storePassword: providers.environmentVariable('DAIMON_UPLOAD_STORE_PASSWORD').orNull,
        keyAlias: providers.environmentVariable('DAIMON_UPLOAD_KEY_ALIAS').orNull,
        keyPassword: providers.environmentVariable('DAIMON_UPLOAD_KEY_PASSWORD').orNull
]
def signingValueCount = signingValues.values().count { it != null && !it.isEmpty() }
if (signingValueCount != 0 && signingValueCount != signingValues.size()) {
    throw new GradleException('All four DAIMON upload-signing environment values are required together.')
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    testImplementation 'junit:junit:4.13.2'
}

// Billing 9 uses the merged Kotlin stdlib. Remove legacy split artifacts pulled
// by older transitive Android tooling to prevent duplicate jdk7/jdk8 classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// The Android shell bundles the existing four-mode PWA (index.html, manifest.json,
// sw.js, assets/, icons/) as offline WebView assets. The PWA source of truth lives
// at the repository root, one directory above this Gradle project (android/..).
// This task copies it into a generated assets dir at build time instead of
// duplicating the (large, binary-heavy) PWA files into the Android module.
def pwaRootDir = rootProject.projectDir.parentFile
def pwaGeneratedAssetsDir = layout.buildDirectory.dir('generated/pwaAssets').get().asFile

def requiredPwaEntries = ['index.html', 'manifest.json', 'sw.js', 'assets', 'icons']

tasks.register('copyPwaAssets', Copy) {
    description = 'Copies the offline four-mode PWA (index.html/manifest.json/sw.js/assets/icons) into the WebView asset bundle.'

    doFirst {
        def missing = requiredPwaEntries.findAll { !new File(pwaRootDir, it).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing required PWA source under ${pwaRootDir}: ${missing.join(', ')}")
        }
    }

    from(pwaRootDir) {
        include 'index.html'
        include 'manifest.json'
        include 'sw.js'
        include 'assets/**'
        include 'icons/**'
    }
    into pwaGeneratedAssetsDir

    // The PWA source files are the single source of truth; this task must never
    // write back into them.
    outputs.dir(pwaGeneratedAssetsDir)
}

tasks.named('preBuild').configure {
    dependsOn 'copyPwaAssets'
}

android {
    namespace 'app.daimon'
    compileSdk 35

    signingConfigs {
        if (signingValueCount == signingValues.size()) {
            releaseUpload {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'app.daimon'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0-beta.1'
        buildConfigField 'String', 'BILLING_PRODUCT_ID', '"' + billingProductId + '"'
        buildConfigField 'String', 'BILLING_BASE_PLAN_ID', '"' + billingBasePlanId + '"'
        buildConfigField 'boolean', 'BILLING_IDS_VERIFIED', billingIdsVerified.toString()
        buildConfigField 'String', 'BILLING_VERIFICATION_URL', '"' + billingVerificationUrl + '"'
        buildConfigField 'boolean', 'BILLING_SERVER_VERIFIED', billingServerVerified.toString()
    }

    sourceSets {
        main {
            assets.srcDirs += pwaGeneratedAssetsDir
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingValueCount == signingValues.size()) signingConfig signingConfigs.releaseUpload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig = true }
}
