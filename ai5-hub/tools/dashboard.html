<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DAIMON Node ダッシュボード</title>
<style>
  body { font-family: "Yu Gothic UI", "Meiryo", sans-serif; background:#0f1117; color:#e6e6e6; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .updated { color:#888; font-size:12px; margin-bottom:20px; }
  h2 { font-size:15px; border-bottom:1px solid #333; padding-bottom:6px; margin-top:32px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid #23262f; }
  th { color:#9aa; font-weight:600; }
  .idle { color:#6bcB77; } .busy { color:#ffcc66; } .unknown { color:#888; }
  .st-READY, .st-COMPLETED { color:#6bcB77; }
  .st-RUNNING, .st-CLAIMED { color:#66b2ff; }
  .st-REVIEW_WAIT, .st-WAITING_OWNER, .st-WAITING_PROVIDER { color:#ffcc66; }
  .st-FAILED_RECOVERABLE, .st-BLOCKED { color:#ff6b6b; }
  .empty { color:#666; font-style:italic; }
  .err { color:#ff6b6b; }
</style>
</head>
<body>
<h1>DAIMON Node ダッシュボード（FUJITSU）</h1>
<div class="updated" id="updated">読み込み中…</div>

<h2>Worker Registry（実状態）</h2>
<table id="workers"><thead><tr><th>Worker</th><th>Node</th><th>状態</th><th>稼働状況</th><th>占有中Lease</th><th>現在のTask</th><th>備考</th></tr></thead><tbody></tbody></table>

<h2>Task Queue（実状態）</h2>
<table id="tasks"><thead><tr><th>Task ID</th><th>状態</th><th>選択Worker</th><th>ブロッカー</th><th>出力</th></tr></thead><tbody></tbody></table>

<h2>アクティブLease</h2>
<table id="leases"><thead><tr><th>Lease</th></tr></thead><tbody></tbody></table>

<script>
// Owner向け表示専用の日本語訳。内部データ（英語のstatus/health等）はそのまま保持し、
// 画面表示だけを翻訳する（DAIMON_WORKER_ROUTING_SPEC.md「Owner向け言語ポリシー」準拠）。
const STATUS_JA = {
  READY: '準備完了', CLAIMED: '受付済み', RUNNING: '実行中',
  REVIEW_WAIT: 'レビュー待ち', BLOCKED: 'ブロック中',
  WAITING_PROVIDER: '外部要因待ち', WAITING_OWNER: '本人判断待ち',
  COMPLETED: '完了', FAILED_RECOVERABLE: '失敗（回復可能）'
};
const BUSY_JA = { busy: '稼働中', idle: '待機中' };
const HEALTH_JA = {
  healthy: '正常', not_connected: '未接続', UNKNOWN: '不明',
  verified_execution_worker: '実行検証済み',
  infrastructure_present_execution_unverified: '基盤あり・実行未検証'
};
function ja(map, value) { return map[value] ?? (value ?? '不明'); }

async function refresh() {
  const updatedEl = document.getElementById('updated');
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('HTTP ' + res.status + '（取得失敗）');
    const data = await res.json();

    updatedEl.textContent = '最終更新: ' + new Date(data.generated_at).toLocaleString('ja-JP') + '（実データ、5秒間隔で自動更新）';
    updatedEl.className = 'updated';

    const wBody = document.querySelector('#workers tbody');
    wBody.innerHTML = '';
    const workers = (data.worker_registry && data.worker_registry.workers) || {};
    for (const [name, w] of Object.entries(workers)) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${name}</td><td>${w.node ?? '-'}</td><td>${ja(HEALTH_JA, w.health)}</td>` +
        `<td class="${w.busy_state==='busy'?'busy':(w.busy_state==='idle'?'idle':'unknown')}">${ja(BUSY_JA, w.busy_state)}</td>` +
        `<td>${w.lease ?? 'なし'}</td><td>${w.current_task ?? 'なし'}</td><td>${w.notes ?? ''}</td>`;
      wBody.appendChild(tr);
    }

    const tBody = document.querySelector('#tasks tbody');
    tBody.innerHTML = '';
    const tasks = data.tasks || [];
    if (tasks.length === 0) {
      tBody.innerHTML = '<tr><td colspan="5" class="empty">現在Taskなし</td></tr>';
    }
    for (const t of tasks) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${t.task_id}</td><td class="st-${t.status}">${ja(STATUS_JA, t.status)}</td>` +
        `<td>${t.selected_worker ?? 'なし'}</td><td>${t.blocker ?? 'なし'}</td><td>${t.output ?? 'なし'}</td>`;
      tBody.appendChild(tr);
    }

    const lBody = document.querySelector('#leases tbody');
    lBody.innerHTML = '';
    const leases = data.active_leases || [];
    if (leases.length === 0) {
      lBody.innerHTML = '<tr><td class="empty">占有中のLeaseなし</td></tr>';
    }
    for (const l of leases) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${l}</td>`;
      lBody.appendChild(tr);
    }
  } catch (e) {
    updatedEl.textContent = '取得に失敗しました： ' + e.message;
    updatedEl.className = 'err';
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
