<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07120f">
  <title>AI5 HUB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><span class="brand-mark">五</span><div><strong>AI5 HUB</strong><small>施工司令室</small></div></div>
      <button class="room active"><span class="avatar zero">0</span><span><b>ゼロ</b><small>総司令塔・本人窓口</small></span><i></i></button>
      <div class="section-title">AI5兄弟</div>
      <div id="agents" class="agents"></div>
      <div class="security"><b>LOCAL FIRST</b><span>認証情報は保存しません</span></div>
    </aside>

    <main class="chat">
      <header>
        <div><h1>ゼロ</h1><p><span id="connectionDot" class="online-dot checking"></span><span id="connectionText">Local API確認中</span></p></div>
        <button id="flowButton" class="ghost">施工フロー</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="ゼロに指示を入力…" aria-label="ゼロへの指示"></textarea>
        <button type="submit" aria-label="送信">送信</button>
        <p>ゼロが目的を整理し、必要な兄弟だけに施工を振り分けます。</p>
      </form>
    </main>

    <aside id="activity" class="activity">
      <div class="activity-head"><div><small>LIVE STATUS</small><h2>施工状況</h2></div><button id="closeFlow" aria-label="閉じる">×</button></div>
      <div id="jobStatus" class="job-card idle"><span>現在</span><b>指示待ち</b><small>ゼロにメッセージを送ってください</small></div>
      <div id="taskProgress" class="task-progress" aria-live="polite"></div>
      <h3>基本ルート</h3>
      <ol class="route">
        <li><b>本人 → ゼロ</b><span>目的と優先順位を整理</span></li>
        <li><b>ゼロ → Codex</b><span>施工計画と安全確認</span></li>
        <li><b>担当AIが実行</b><span>必要最小構成で並行処理</span></li>
        <li><b>ゼロ → 本人</b><span>統合結果を最終報告</span></li>
      </ol>
      <h3>承認待ち</h3>
      <div id="approvalArea" class="approval-empty">現在、本人確認が必要な操作はありません。</div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
